name: modelo-dengue-mlflow
services:
  mlflow:
    build: .
    image: modelo-dengue/mlflow:3.17.2
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=1
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artifacts
      - --allowed-hosts=localhost:*,127.0.0.1:*,mlflow:5000
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
  cliente:
    image: modelo-dengue/mlflow:3.17.2
    build: .
    profiles: ["herramientas"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "/opt/mlflow/verificar_instalacion.py"]
  importador:
    image: modelo-dengue/mlflow:3.17.2
    build: .
    profiles: ["herramientas"]
    working_dir: /workspace
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DENGUE_GIT_COMMIT: ${DENGUE_GIT_COMMIT:-no_disponible}
      PYTHONDONTWRITEBYTECODE: "1"
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ../..:/workspace:ro
    depends_on:
      mlflow:
        condition: service_healthy
    command: ["python", "scripts/importar_experimentos.py"]
volumes:
  mlflow_data:
